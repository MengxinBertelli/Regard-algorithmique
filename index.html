<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Installation Algorithmique : Mode d'Emploi Clair</title>

<style>

body {

margin: 0;

overflow: hidden;

background-color: #000;

font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

}


#canvas-container {

width: 100vw;

height: 100vh;

}


/* Bouton de bascule de l'interface */

#toggle-guide-btn {

position: absolute;

top: 20px;

left: 20px;

z-index: 20;

background: rgba(0, 0, 0, 0.6);

color: #ffd700;

border: 1px solid #ffd700;

padding: 8px 15px;

cursor: pointer;

font-family: 'Courier New', monospace;

font-size: 0.8rem;

letter-spacing: 2px;

transition: all 0.3s ease;

backdrop-filter: blur(5px);

border-radius: 4px;

pointer-events: auto;

}


#toggle-guide-btn:hover {

background: #ffd700;

color: #000;

}


/* Panneau d'instructions */

#guide-ui {

position: absolute;

top: 80px;

left: 20px;

color: white;

pointer-events: none;

z-index: 5;

background: rgba(0, 0, 0, 0.4);

padding: 25px;

border-radius: 8px;

backdrop-filter: blur(5px);

border-left: 4px solid #ffd700;

transition: opacity 0.5s ease, transform 0.5s ease;

opacity: 1;

transform: translateX(0);

}


#guide-ui.hidden {

opacity: 0;

transform: translateX(-20px);

pointer-events: none;

}


h1 {

font-size: 1.5rem;

margin: 0 0 15px 0;

letter-spacing: 2px;

color: #ffd700;

text-transform: uppercase;

}


.instruction {

margin: 12px 0;

font-size: 0.95rem;

display: flex;

align-items: center;

}


.cmd {

background: #ffd700;

color: #000;

padding: 2px 8px;

border-radius: 4px;

font-weight: bold;

margin-right: 10px;

font-family: 'Courier New', monospace;

min-width: 100px;

text-align: center;

display: inline-block;

}


.status-badge {

display: inline-block;

margin-top: 20px;

padding: 8px 16px;

background: rgba(255, 215, 0, 0.15);

border: 1px solid #ffd700;

color: #ffd700;

font-weight: bold;

text-transform: uppercase;

letter-spacing: 1px;

font-size: 0.8rem;

}


#video-container {

position: absolute;

bottom: 30px;

right: 30px;

width: 220px;

height: 165px;

border-radius: 8px;

border: 2px solid rgba(255, 215, 0, 0.4);

overflow: hidden;

transform: scaleX(-1);

z-index: 10;

}


#input-video { width: 100%; height: 100%; object-fit: cover; }


.loading-overlay {

position: fixed;

inset: 0;

background: #000;

display: flex;

flex-direction: column;

justify-content: center;

align-items: center;

color: #fff;

z-index: 100;

transition: opacity 1s;

}

.progress-bar { width: 280px; height: 2px; background: #222; margin-top: 20px; }

#progress-fill { height: 100%; background: #ffd700; width: 0%; transition: width 0.4s; }

</style>

</head>

<body>


<div id="loading" class="loading-overlay">

<div id="loading-text">CHARGEMENT DES SYSTÈMES DE DÉSIR...</div>

<div class="progress-bar"><div id="progress-fill"></div></div>

</div>


<!-- Nouveau bouton de bascule -->

<button id="toggle-guide-btn" onclick="toggleGuide()">MASQUER INFO</button>


<div id="guide-ui">

<h1>Contrôle de l'Univers</h1>


<div class="instruction">

<span class="cmd">1 - 5 DOIGTS</span> <span>SÉLECTIONNER une nébuleuse</span>

</div>

<div class="instruction">

<span class="cmd">AVANCER</span> <span>IMMERSION dans les données</span>

</div>

<div class="instruction">

<span class="cmd">POING FERMÉ</span> <span>RETRAIT et vue globale</span>

</div>

<div class="instruction">

<span class="cmd">INCLINER</span> <span>PIVOTER l'espace algorithmique</span>

</div>


<div id="gesture-status" class="status-badge">Initialisation caméra...</div>

</div>


<div id="video-container">

<video id="input-video" playsinline></video>

</div>


<div id="canvas-container"></div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>


<script>

let scene, camera, renderer, systemGroup;

let videoElement, hands, cameraHelper;

let isHandsReady = false;

let isProcessing = false;


// Logique de bascule de l'interface

function toggleGuide() {

const ui = document.getElementById('guide-ui');

const btn = document.getElementById('toggle-guide-btn');

const isHidden = ui.classList.toggle('hidden');

btn.innerText = isHidden ? "AFFICHER INFO" : "MASQUER INFO";

}


const nebulaGroups = [];

const planetColorSchemes = [

{ main: 0xffd700, grad: 0x885500, accent: 0xffffff, key: 'richesse' },

{ main: 0x00eaff, grad: 0x001155, accent: 0x99ff00, key: 'donnees' },

{ main: 0xff0044, grad: 0x440011, accent: 0x00ffcc, key: 'pari' },

{ main: 0xaa00ff, grad: 0x220044, accent: 0xffaa00, key: 'ego' },

{ main: 0x33ff00, grad: 0x002205, accent: 0xff00ff, key: 'algorithme' }

];


const TEXTURES_PER_PLANET = 12; 

let cameraDist = 65;

let targetRotation = 0;

let currentRotation = 0;

let prevHandSize = null;

let targetFocusPoint = new THREE.Vector3(0, 0, 0);

let currentFocusPoint = new THREE.Vector3(0, 0, 0);

let activePlanetIdx = -1;

let stableFingerCount = 0;

let fingerStabilityFrames = 0;


const loader = new THREE.TextureLoader();

const loadingManager = new THREE.LoadingManager();


loadingManager.onProgress = (url, itemsLoaded, itemsTotal) => {

const fill = document.getElementById('progress-fill');

if (fill) fill.style.width = (itemsLoaded / itemsTotal * 100) + '%';

};

loadingManager.onLoad = () => {

const overlay = document.getElementById('loading');

if(overlay) {

overlay.style.opacity = '0';

setTimeout(() => {

overlay.remove();

startAutoTextureUpdate();

}, 1200);

}

};


function init() {

scene = new THREE.Scene();

camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 10000);

renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });

renderer.setSize(window.innerWidth, window.innerHeight);

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

document.getElementById('canvas-container').appendChild(renderer.domElement);


systemGroup = new THREE.Group();

scene.add(systemGroup);


const planetLoader = new THREE.TextureLoader(loadingManager);

const positions = [[0, 0, 0], [40, 20, -35], [-45, -15, -30], [32, -40, 30], [-28, 35, 25]];


positions.forEach((p, i) => {

const nebula = createArtisticNebula(planetLoader, planetColorSchemes[i], i);

nebula.position.set(p[0], p[1], p[2]);

systemGroup.add(nebula);

nebulaGroups.push(nebula);

});


createAtmosphere();

window.addEventListener('resize', onWindowResize);

}


function createArtisticNebula(loader, colors, pIdx) {

const group = new THREE.Group();

group.userData = { pIdx: pIdx, key: colors.key };

const totalCount = 2400;

const batchSize = Math.floor(totalCount / TEXTURES_PER_PLANET);


for (let b = 0; b < TEXTURES_PER_PLANET; b++) {

const texture = loader.load(`https://picsum.photos/seed/${colors.key}-${pIdx}-${b}/400/400`);

const geo = new THREE.BufferGeometry();

const pos = new Float32Array(batchSize * 3);

const colArr = new Float32Array(batchSize * 3);

const mainCol = new THREE.Color(colors.main), gradCol = new THREE.Color(colors.grad), accentCol = new THREE.Color(colors.accent);


for (let i = 0; i < batchSize; i++) {

const theta = Math.random() * Math.PI * 2, phi = Math.acos((Math.random() * 2) - 1);

const noise = Math.sin(theta * 3) * Math.cos(phi * 2) * 2.8;

const randomFactor = Math.random();

let dist = randomFactor > 0.75 ? (10 + noise) * (1.3 + Math.random() * 0.7) : randomFactor > 0.15 ? (9 + noise) * (0.8 + Math.random() * 0.4) : Math.random() * 5;


pos[i * 3] = dist * Math.sin(phi) * Math.cos(theta);

pos[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);

pos[i * 3 + 2] = dist * Math.cos(phi);


const finalCol = Math.random() > 0.94 ? accentCol : mainCol.clone().lerp(gradCol, Math.min(dist/16.0, 1.0));

colArr[i * 3] = finalCol.r; colArr[i * 3 + 1] = finalCol.g; colArr[i * 3 + 2] = finalCol.b;

}

geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

geo.setAttribute('color', new THREE.BufferAttribute(colArr, 3));


const mat = new THREE.PointsMaterial({ size: 2.3, map: texture, transparent: true, opacity: 0.88, vertexColors: true, blending: THREE.NormalBlending, depthWrite: false, alphaTest: 0.04 });

group.add(new THREE.Points(geo, mat));

}

return group;

}


function startAutoTextureUpdate() {

setInterval(() => {

const nebula = nebulaGroups[Math.floor(Math.random() * nebulaGroups.length)];

const targetPoints = nebula.children[Math.floor(Math.random() * TEXTURES_PER_PLANET)];

if (targetPoints && targetPoints.isPoints) {

loader.load(`https://picsum.photos/seed/${nebula.userData.key}-${Math.random()}/400/400`, (newTex) => {

targetPoints.material.map.dispose();

targetPoints.material.map = newTex;

targetPoints.material.needsUpdate = true;

});

}

}, 2000);

}


function createAtmosphere() {

const bgGeo = new THREE.BufferGeometry(), bgPos = new Float32Array(9000 * 3);

for(let i=0; i<9000; i++) {

bgPos[i*3] = (Math.random()-0.5)*3000; bgPos[i*3+1] = (Math.random()-0.5)*3000; bgPos[i*3+2] = (Math.random()-0.5)*3000;

}

bgGeo.setAttribute('position', new THREE.BufferAttribute(bgPos, 3));

scene.add(new THREE.Points(bgGeo, new THREE.PointsMaterial({ size: 0.5, color: 0x111111 })));

}


function initMediaPipe() {

videoElement = document.getElementById('input-video');

hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${file}` });

hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });

hands.onResults((results) => { isProcessing = false; onHandResults(results); });


cameraHelper = new Camera(videoElement, { 

onFrame: async () => { 

if (isProcessing || !isHandsReady || videoElement.readyState < 2 || videoElement.videoWidth === 0) return;

try { isProcessing = true; await hands.send({ image: videoElement }); } catch (e) { isProcessing = false; }

}, 

width: 640, height: 480 

});


hands.initialize().then(() => { isHandsReady = true; cameraHelper.start(); });

}


function onHandResults(results) {

const status = document.getElementById('gesture-status');

if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {

const lm = results.multiHandLandmarks[0];

targetRotation = -(Math.atan2(lm[9].y - lm[0].y, lm[9].x - lm[0].x) + Math.PI/2) * 3.8;

const currentCount = countFingers(lm);


if (currentCount === stableFingerCount) fingerStabilityFrames++;

else { stableFingerCount = currentCount; fingerStabilityFrames = 0; }


if (fingerStabilityFrames > 5) {

if (stableFingerCount >= 1 && stableFingerCount <= 5) {

activePlanetIdx = stableFingerCount - 1;

targetFocusPoint.copy(nebulaGroups[activePlanetIdx].position);

status.innerText = `CIBLE : Nébuleuse ${stableFingerCount}`;

} else if (stableFingerCount === 0) {

activePlanetIdx = -1;

targetFocusPoint.set(0, 0, 0);

status.innerText = "VUE GLOBALE RÉINITIALISÉE";

}

}


const handSize = Math.hypot(lm[5].x - lm[17].x, lm[5].y - lm[17].y);

if (prevHandSize !== null) {

const delta = handSize - prevHandSize;

if (stableFingerCount >= 1 && delta > 0.0012) {

cameraDist -= Math.sqrt(Math.abs(delta) * 1500) * 0.9;

status.innerText = "IMMERSION PROFONDE...";

} else if (stableFingerCount === 0 && delta < -0.0012) {

cameraDist += Math.pow(Math.abs(delta) * 1500, 1.4) * 0.28;

status.innerText = "RETRAIT DU SYSTÈME";

}

}

cameraDist = Math.max(2, Math.min(300, cameraDist));

prevHandSize = handSize;

} else {

status.innerText = "EN ATTENTE D'UN SIGNAL...";

prevHandSize = null;

}

}


function countFingers(lm) {

let count = 0;

const tips = [8, 12, 16, 20], joints = [6, 10, 14, 18];

for(let i=0; i<4; i++) if(lm[tips[i]].y < lm[joints[i]].y) count++;

if(Math.abs(lm[4].x - lm[17].x) > 0.18) count++;

return count;

}


function onWindowResize() {

camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();

renderer.setSize(window.innerWidth, window.innerHeight);

}


function animate() {

requestAnimationFrame(animate);

currentFocusPoint.lerp(targetFocusPoint, 0.09);

currentRotation += (targetRotation - currentRotation) * 0.1;

camera.position.x = currentFocusPoint.x + cameraDist * Math.sin(currentRotation);

camera.position.z = currentFocusPoint.z + cameraDist * Math.cos(currentRotation);

camera.position.y = currentFocusPoint.y + (cameraDist * 0.12);

camera.lookAt(currentFocusPoint);


const time = Date.now() * 0.001;

nebulaGroups.forEach((g, i) => {

g.rotation.y += 0.0008;

const isFocused = (activePlanetIdx === i);

g.children.forEach((child, ci) => {

if (child.isPoints) {

child.material.size = (isFocused ? 3.6 : 2.4) + Math.sin(time * 2 + ci * 0.5) * 0.4;

}

});

});

renderer.render(scene, camera);

}


init(); initMediaPipe(); animate();

</script>

</body>

</html>
